[project]
name = "commerce-lakehouse-generator"
version = "0.1.0"
description = "Phase 1 OLTP data generator for the real-time commerce data platform"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "faker>=24.0",
    "pydantic-settings>=2.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
